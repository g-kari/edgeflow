name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Node.js を準備
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: テスト
        run: npm test

      - name: 型チェック
        run: npm run typecheck

      - name: バンドルサイズを計測
        run: npm run size

      - name: startup を計測
        run: npm run startup

      - name: startup プロファイルを保存
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: worker-startup-profile
          path: worker-startup.cpuprofile
          if-no-files-found: ignore
          retention-days: 7
